; ESP32 İnternet Radyosu — ESP32-WROOM-32 DevKit + MAX98357A + ILI9341
; Derle ve yükle:          pio run -t upload
; İstasyon listesini yükle: pio run -t uploadfs   (data/stations.json → LittleFS)
; Seri monitör:            pio device monitor

[env:netradio]
; espressif32 6.x = Arduino core 2.0.x.
; Neden sabitlendi: TFT_eSPI 2.5.x ve ESP32-audioI2S 2.0.7 core 2.0.x üzerinde sorunsuz;
; core 3.x SPI/LEDC/I2S iç yapısını değiştirdi.
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200

; Ses kütüphanesi + fontlar 1,25 MB'lık varsayılan uygulama bölümüne sığmıyor (3 MB uygulama, OTA yok).
; Bölüm tablosu değişince LittleFS de yeniden yüklenmeli (uploadfs).
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.0.4
    esphome/ESP32-audioI2S @ 2.0.7

build_flags =
    ; --- TFT_eSPI: User_Setup.h yerine burada (kütüphane klasörü düzenlenmez) ---
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=17
    -D TFT_RST=16
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    ; Dokunmatik kullanılmasa da CS tanımlı kalır: TFT_eSPI pini HIGH tutar,
    ; XPT2046 ortak SPI hattını meşgul etmez.
    -D TOUCH_CS=15
    -D LOAD_GLCD=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
